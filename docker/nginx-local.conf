# nginx entry point for local FREE Studio, run as a container via
# compose.nginx.yaml. Matches .env: STUDIO_ORIGIN=https://localhost:8443,
# STUDIO_BASE_PATH=/free
server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/studio.crt;
    ssl_certificate_key /etc/nginx/certs/studio.key;

    location = /free {
        return 308 /free/;
    }

    location ^~ /free/ {
        proxy_pass http://studio:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1000s;
        client_max_body_size 60m;
    }
}
