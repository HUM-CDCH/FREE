services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    user: vscode
    command: ["/usr/local/bin/start-keyring", "sleep", "infinity"]
    volumes:
      - ..:/workspaces/FREE:cached
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: free
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d free"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
