# Operator-owned Claude Code login; no GPU model servers or researcher keys are needed for extraction.
# Use KEI_EXTRACT_PROVIDER=claude-code FREE_GPU=off KEI_CLAUDE_MODEL=<model-id> CLAUDE_CODE_OAUTH_TOKEN=<token> pnpm dev.
x-claude-environment: &claude-environment
  KEI_EXTRACT_PROVIDER: claude-code
  KEI_EXTRACT_MODEL: "${KEI_CLAUDE_MODEL:?Set KEI_CLAUDE_MODEL to a full Claude model ID available to your login}"
  # Each call runs in its own empty configuration directory, so the login travels only as this token.
  CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:?Set CLAUDE_CODE_OAUTH_TOKEN from claude setup-token}"

services:
  studio:
    environment:
      # Match this overlay's effective per-conversion OCR client limit below.
      FREE_PARSING_OCR_PARALLEL: "1"

  parsing_service:
    environment: *claude-environment

  parsing_worker:
    environment:
      <<: *claude-environment
      # Each call owns a CLI process and a fresh context; bound deployment login concurrency.
      KEI_CATALOG_CHUNKS: "1"
      SURYA_INFERENCE_PARALLEL: "1"
