services:
  contract-model:
    image: node:24-alpine
    command: ["node", "/fixture/model.mjs"]
    volumes:
      - ./tests/model-fixture.mjs:/fixture/model.mjs:ro
    networks:
      - app

  parsing_service:
    environment:
      KEI_EXTRACT_URL: http://contract-model:8000/v1/chat/completions
      KEI_EXTRACT_MODEL: contract-fixture

  parsing_worker:
    environment:
      KEI_EXTRACT_URL: http://contract-model:8000/v1/chat/completions
      KEI_EXTRACT_MODEL: contract-fixture
