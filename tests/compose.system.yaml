services:
  phoenix:
    # Isolated test stacks keep tracing without taking the deployment's dashboard port.
    ports: !override
      - "127.0.0.1::6006"

  contract-model:
    image: node:24-alpine
    command: ["node", "/fixture/model.mjs"]
    volumes:
      - ./tests/model-fixture.mjs:/fixture/model.mjs:ro
    networks:
      - app

  parsing_service:
    environment:
      KEI_EXTRACT_URL: http://contract-model:8000/v1/chat/completions
      KEI_EXTRACT_MODEL: contract-fixture

  parsing_worker:
    environment:
      KEI_EXTRACT_URL: http://contract-model:8000/v1/chat/completions
      KEI_EXTRACT_MODEL: contract-fixture

  studio:
    environment:
      FREE_STUDIO_PROXY_ADDRESS: 172.31.251.0/24

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.31.251.0/24
