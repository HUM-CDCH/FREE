schema_version: 1

# The canonical Slopo config owns source discovery and exclusions.
source_config: slopo.conf.yaml
work_dir: .slopo/pipeline
model_cache_dir: tools/slopo-benchmark/work/model-cache
review_dir: tools/slopo-benchmark/ignores
adjudications_file: tools/slopo-benchmark/operational-adjudications.json

models:
  - configuration: pplx-v1-0.6b-512d
    family: pplx-v1-0.6b
    dimensions: 512
    role: discovery
    similarity_threshold: 0.8167676767676768
    rerank_threshold: 0.8167676767676768

  - configuration: jina-v2-code-768d
    family: jina-v2-code
    dimensions: 768
    role: discovery
    similarity_threshold: 0.7926018238067627
    rerank_threshold: 0.9538904536581594

  - configuration: qwen3-0.6b-1024d
    family: qwen3-0.6b
    dimensions: 1024
    role: discovery
    similarity_threshold: 0.8761616161616161
    rerank_threshold: 0.8761616161616161

  - configuration: voyage-4-nano-512d
    family: voyage-4-nano
    dimensions: 512
    role: confirmation
    similarity_threshold: 0.9224504232406616
    rerank_threshold: 0.9224504232406616

fusion:
  primary_configuration: pplx-v1-0.6b-512d
  pool_size_per_configuration: 50
  member_jaccard_threshold: 0.60
  minimum_shared_members: 2
  minimum_support: 2
  rrf_k: 60
  transitive_member_union: false
