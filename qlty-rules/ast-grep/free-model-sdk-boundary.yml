id: free-model-sdk-boundary
language: TypeScript
files:
  - prototypes/studio/**/*.ts
ignores:
  - prototypes/studio/api/_model.ts
  - prototypes/studio/**/*.test.ts
rule:
  any:
    - pattern: generateText($$$ARGS)
    - pattern: streamText($$$ARGS)
    - pattern: $SDK.generateText($$$ARGS)
    - pattern: $SDK.streamText($$$ARGS)
message: Route AI SDK generation through api/_model.ts so every model operation uses FREE's configured Capability Route boundary.
severity: warning
