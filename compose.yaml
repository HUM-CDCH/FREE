# Private production topology. Caddy is the only host-published service; all
# application traffic reaches Studio through the dedicated proxy network.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: free
      POSTGRES_PASSWORD: "${FREE_POSTGRES_PASSWORD:?FREE_POSTGRES_PASSWORD must be set to a generated hexadecimal password}"
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d free"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app

  parsing_service:
    build:
      context: prototypes/parsing_service_simple
    restart: unless-stopped
    # Keep the default local stack portable. GPU deployments must explicitly
    # provide their NVIDIA runtime/device configuration and select CUDA.
    environment:
      DOCLING_DEVICE: cpu
    ports:
      - "127.0.0.1:8055:8055"
    healthcheck:
      # `/status` answers only once the Docling pipeline is initialized, and the
      # first start downloads its models, so the start period is generous.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8055/status', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
    volumes:
      - parsing-tasks:/app/data
      - parsing-models:/models
    networks:
      - app

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      STUDIO_ORIGIN: "${STUDIO_ORIGIN:?STUDIO_ORIGIN must be set to the canonical HTTPS origin}"
    ports:
      - "8443:443"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO /dev/null --no-check-certificate
          --header="Host: $${STUDIO_ORIGIN#https://}"
          https://127.0.0.1:8443/api/healthz
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 12
    depends_on:
      studio:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: 172.30.0.2
    volumes:
      - type: bind
        source: ./docker/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${FREE_TLS_CERTIFICATE_PATH:?FREE_TLS_CERTIFICATE_PATH must point to the supplied PEM certificate}"
        target: /etc/caddy/tls/studio.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${FREE_TLS_PRIVATE_KEY_PATH:?FREE_TLS_PRIVATE_KEY_PATH must point to the supplied PEM private key}"
        target: /etc/caddy/tls/studio.key
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
      - caddy-config:/config

  studio:
    build:
      context: .
      dockerfile: prototypes/studio/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${FREE_POSTGRES_PASSWORD:?FREE_POSTGRES_PASSWORD must be set to a generated hexadecimal password}@db:5432/free"
      PARSING_SERVICE_URL: http://parsing_service:8055
      STUDIO_ORIGIN: "${STUDIO_ORIGIN:?STUDIO_ORIGIN must be set to the canonical HTTPS origin}"
      FREE_SESSION_SECRET: "${FREE_SESSION_SECRET:?FREE_SESSION_SECRET must be canonical base64 decoding to at least 32 bytes}"
      FREE_STUDIO_PROXY: trusted-caddy
      FREE_STUDIO_PROXY_ADDRESS: 172.30.0.2
    depends_on:
      db:
        condition: service_healthy
      parsing_service:
        condition: service_started
    healthcheck:
      # The hosted server rejects direct HTTP peers other than pinned Caddy.
      # A local TCP connection proves the Node host started after migrations.
      test:
        - CMD
        - node
        - -e
        - "const socket=require('node:net').connect(5173,'127.0.0.1');socket.setTimeout(3000);socket.once('connect',()=>{socket.end();process.exit(0)});socket.once('timeout',()=>{socket.destroy();process.exit(1)});socket.once('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      # Canonical ingestion packages under `env-paths('FREE Studio').data`.
      - studio-data:/root/.local/share
      # `model-config.json` under `env-paths('FREE Studio').config`.
      - studio-config:/root/.config
    networks:
      app:
      proxy:
        ipv4_address: 172.30.0.3

volumes:
  postgres-data:
  parsing-tasks:
  parsing-models:
  studio-data:
  studio-config:
  caddy-data:
  caddy-config:

networks:
  app:
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24
