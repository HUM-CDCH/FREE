# The single FREE topology. Compose is the only orchestrator, nginx is the
# only entry point, and TLS plus the prefixed STUDIO_BASE_PATH are always on,
# so development and production differ only by overlay:
#
#   node scripts/free.mjs local          # development: containerized nginx
#                                        # (compose.override.yaml is loaded
#                                        # automatically by `docker compose up`)
#   node scripts/free.mjs production     # production: host-managed nginx in
#                                        # front (compose.yaml + compose.prod.yaml)
#
# The base file is not a runnable topology on its own: the entry point (the
# development nginx container, or the production loopback publish for the host
# nginx), the trusted proxy peer, the Studio process command, and the database
# credentials all come from the chosen overlay, so skipping the overlay fails
# instead of silently running with development defaults.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: free
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d free"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app

  parsing_service:
    build:
      context: prototypes/parsing_service
    # Keep local development portable; compose.prod.yaml selects CUDA and
    # configures the NVIDIA runtime/device reservation for DGX Spark.
    environment:
      DOCLING_DEVICE: "${DOCLING_DEVICE:-cpu}"
    # Host loopback publish for the operator's own web app. Port 8000 is
    # already taken on the deployment machine.
    ports:
      - "127.0.0.1:8055:8055"
    healthcheck:
      # `/status` answers only once the Docling pipeline is initialized, and the
      # first start downloads its models, so the start period is generous.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8055/status', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
    volumes:
      - parsing-tasks:/app/data
      - parsing-models:/models
    networks:
      - app

  studio:
    build:
      context: .
      dockerfile: prototypes/studio/Dockerfile
    environment:
      NODE_ENV: production
      PARSING_SERVICE_URL: http://parsing_service:8055
      STUDIO_ORIGIN: "${STUDIO_ORIGIN:-https://localhost:8443}"
      STUDIO_BASE_PATH: "${STUDIO_BASE_PATH:-/free}"
      FREE_STUDIO_PROXY: trusted-proxy
      # A Claude Code connection spawns the `claude` CLI as a subprocess; it
      # authenticates from this env var (`claude setup-token`'s own output)
      # rather than an interactive login, since the CLI's usual credential
      # storage (macOS Keychain on a developer host) isn't reachable from
      # inside this container. Optional: unset if no Claude Code connection
      # is configured in model-config.json.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      # FREE_STUDIO_PROXY_ADDRESS comes from the overlay: development trusts
      # the dedicated proxy network (the nginx container is its only other
      # member), production pins the proxy network's bridge gateway, which is
      # where the host nginx's loopback connections enter.
    depends_on:
      db:
        condition: service_healthy
      parsing_service:
        condition: service_started
    healthcheck:
      # Studio rejects direct HTTP peers outside the proxy network. A local TCP
      # connection proves the server started after migrations.
      test:
        - CMD
        - node
        - -e
        - "const socket=require('node:net').connect(5173,'127.0.0.1');socket.setTimeout(3000);socket.once('connect',()=>{socket.end();process.exit(0)});socket.once('timeout',()=>{socket.destroy();process.exit(1)});socket.once('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      # Canonical ingestion packages under `env-paths('FREE Studio').data`.
      - studio-data:/root/.local/share
      # `model-config.json` under `env-paths('FREE Studio').config`.
      - studio-config:/root/.config
      # Claude Code CLI login state (`claude /login` or `claude setup-token`,
      # run once with `docker exec`). Not shared with the host: the host CLI's
      # OAuth credential lives in the macOS Keychain, which a Linux container
      # cannot read regardless of what's mounted here, so this volume only
      # persists a login performed inside the container itself.
      - studio-claude:/root/.claude
    networks:
      app:
      proxy:

volumes:
  postgres-data:
  parsing-tasks:
  parsing-models:
  studio-data:
  studio-config:
  studio-claude:

networks:
  app:
  # Fixed subnet: it is the FREE_STUDIO_PROXY_ADDRESS trust block above.
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24
