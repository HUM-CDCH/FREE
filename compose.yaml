# Private production topology. The host nginx reverse proxy is the only public
# entry point: it terminates TLS and forwards the configured base path to
# Studio through the loopback-published port. Studio accepts requests only from
# the pinned proxy-network bridge gateway.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: free
      POSTGRES_PASSWORD: "${FREE_POSTGRES_PASSWORD:?FREE_POSTGRES_PASSWORD must be set to a generated hexadecimal password}"
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d free"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app

  parsing_service:
    build:
      context: prototypes/parsing_service
    restart: unless-stopped
    # Keep the default local stack portable. GPU deployments must explicitly
    # provide their NVIDIA runtime/device configuration and select CUDA.
    environment:
      DOCLING_DEVICE: cpu
    # Host loopback publish for the operator's own web app. Port 8000 is
    # already taken on the deployment machine.
    ports:
      - "127.0.0.1:8055:8055"
    healthcheck:
      # `/status` answers only once the Docling pipeline is initialized, and the
      # first start downloads its models, so the start period is generous.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8055/status', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
    volumes:
      - parsing-tasks:/app/data
      - parsing-models:/models
    networks:
      - app

  studio:
    build:
      context: .
      dockerfile: prototypes/studio/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${FREE_POSTGRES_PASSWORD:?FREE_POSTGRES_PASSWORD must be set to a generated hexadecimal password}@db:5432/free"
      PARSING_SERVICE_URL: http://parsing_service:8055
      STUDIO_ORIGIN: "${STUDIO_ORIGIN:?STUDIO_ORIGIN must be set to the canonical HTTPS origin}"
      STUDIO_BASE_PATH: "${STUDIO_BASE_PATH:?STUDIO_BASE_PATH must be / or a canonical path such as /free}"
      FREE_SESSION_SECRET: "${FREE_SESSION_SECRET:?FREE_SESSION_SECRET must be canonical base64 decoding to at least 32 bytes}"
      FREE_ENTRA_TENANT_ID: "${FREE_ENTRA_TENANT_ID:?FREE_ENTRA_TENANT_ID must be the application tenant UUID}"
      FREE_ENTRA_CLIENT_ID: "${FREE_ENTRA_CLIENT_ID:?FREE_ENTRA_CLIENT_ID must be the application client UUID}"
      FREE_ENTRA_CLIENT_CERT_PATH: /run/secrets/free-entra-client.pem
      FREE_ENTRA_CLIENT_CERT_THUMBPRINT: "${FREE_ENTRA_CLIENT_CERT_THUMBPRINT:?FREE_ENTRA_CLIENT_CERT_THUMBPRINT must be the SHA-256 certificate thumbprint}"
      FREE_STUDIO_PROXY: trusted-proxy
      FREE_STUDIO_PROXY_ADDRESS: 172.30.0.1
    depends_on:
      db:
        condition: service_healthy
      parsing_service:
        condition: service_started
    healthcheck:
      # The hosted server rejects direct HTTP peers other than its pinned proxy.
      # A local TCP connection proves the Node host started after migrations.
      test:
        - CMD
        - node
        - -e
        - "const socket=require('node:net').connect(5173,'127.0.0.1');socket.setTimeout(3000);socket.once('connect',()=>{socket.end();process.exit(0)});socket.once('timeout',()=>{socket.destroy();process.exit(1)});socket.once('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - type: bind
        source: "${FREE_ENTRA_CLIENT_CERT_PATH:?FREE_ENTRA_CLIENT_CERT_PATH must name the Entra client private-key PEM}"
        target: /run/secrets/free-entra-client.pem
        read_only: true
        bind:
          create_host_path: false
      # Canonical ingestion packages under `env-paths('FREE Studio').data`.
      - studio-data:/root/.local/share
      # `model-config.json` under `env-paths('FREE Studio').config`.
      - studio-config:/root/.config
    ports:
      - 127.0.0.1:5173:5173
    networks:
      app:
      proxy:
        ipv4_address: 172.30.0.3
        # Host port forwarding must enter through this network: Docker otherwise
        # routes the published port via the `app` network, so nginx connections
        # would arrive from its gateway and be rejected as an untrusted peer.
        gw_priority: 1

volumes:
  postgres-data:
  parsing-tasks:
  parsing-models:
  studio-data:
  studio-config:

networks:
  app:
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24
