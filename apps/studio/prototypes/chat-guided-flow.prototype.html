<!doctype html>
<!--
  PROTOTYPE: throwaway, do not ship.
  Question: if chat guides the researcher from Schema Suggestion to Run extraction
  (they type, the model answers in text or offers approval buttons, like Claude Code's
  permission prompts), what should that look like?
  Three structurally different variants, switchable with ?variant=A|B|C, the bottom bar, or ← →.
  The chat also converses (ADR 0023): a question is answered from the Source Document (in its
  language; every window of a long source), is never kept as a generation instruction, and leaves
  any open approval open. Anything else is an instruction or an edit proposal.
  No model or backend: replies come from a scripted stub; state lives in memory.
  Open the file in a browser; no build needed.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

  /* ---------- Variant C: workspace + command bar ---------- */
  .C { display:grid; grid-template-columns:190px 1fr 360px; height:100%; }
  .C .docwrap { position:relative; min-height:0; display:flex; flex-direction:column; }
  .C .doc { flex:1; min-height:0; padding-bottom:220px; }
  .C .rail { background:var(--surface); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .C .tabs { display:flex; gap:2px; padding:8px 10px 0; border-bottom:1px solid var(--line); }
  .C .tab { padding:6px 10px; font-size:12px; font-weight:600; color:var(--ink-muted); border-bottom:2px solid transparent; display:flex; gap:6px; align-items:center; }
  .C .tab.cur { color:var(--accent); border-color:var(--accent); }
  .C .rail-body { flex:1; min-height:0; padding:12px; }
  .C .applybar { border-top:1px solid var(--line); padding:8px 12px; display:flex; gap:8px; background:var(--accent-ghost); align-items:center; }
  .C .cmd { position:absolute; left:50%; transform:translateX(-50%); bottom:60px; width:min(620px,calc(100% - 32px)); z-index:20; }
  .C .pop { background:var(--surface); border:1px solid var(--line-strong); border-radius:10px; box-shadow:var(--shadow-float); margin-bottom:8px; max-height:52vh; display:flex; flex-direction:column; }

  .C .pstep { display:flex; gap:8px; align-items:flex-start; padding:3px 0; font-size:12px; }

<body>
<div class="topbar"><div class="mono-mark">F</div><b>Danish Letters</b><span class="muted small">/ Letters_1843.pdf</span><span class="grow"></span><span class="pill pill-stale">PROTOTYPE · stub model, no persistence</span></div>
<div id="app"></div>
<div id="switcher"></div>
<pre id="statepanel" hidden></pre>
<script>
// ======================================================================
// Scripted engine shared by all variants. Variants only differ in render.
// ======================================================================
const DOC = 'Letters_1843.pdf'
const BASE_FIELDS = [
  { name: 'sender', type: 'string' },
  { name: 'recipient', type: 'string' },
  { name: 'date_written', type: 'date' },
  { name: 'place_written', type: 'string' },
  { name: 'mentioned_people', type: 'array<string>' },
  { name: 'summary', type: 'string' },
]
const SAMPLE = [
  ['H. C. Andersen', 'Henriette Wulff', '1843-03-02', 'Copenhagen'],
  ['Henriette Wulff', 'H. C. Andersen', '1843-03-19', 'Copenhagen'],
  ['H. C. Andersen', 'Edvard Collin', '1843-04-11', 'Paris'],
  ['Jonas Collin', 'H. C. Andersen', '1843-05-02', 'Copenhagen'],
  ['H. C. Andersen', 'B. S. Ingemann', '1843-06-20', 'Gisselfeld'],
]
const STAGES = [
  ['start', 'Describe', 'What to extract'],
  ['suggest', 'Suggest schema', 'Schema Suggestion'],
  ['review', 'Review schema', 'Apply a revision'],
  ['strategy', 'Article or Catalog', 'Record Scope'],
  ['run', 'Run extraction', 'Asks before running'],
  ['results', 'Review results', 'Values to check'],
]

let S, seq = 0, timer = null

function reset() {
  clearInterval(timer)
  S = {
    stage: 'start', messages: [], pending: null, redirect: null, instructions: [], cite: null, answering: null,
    schema: null, rev: 0, proposal: null, strategy: null, suggest: null, run: null,
    allow: { suggest: false }, plan: null, ws: 'document', expanded: false, cursor: 0,
  }
  say(`Hi. **Danish Letters** has 3 Source Documents. Ask me anything about *${DOC}*, tell me what you want to extract, or ask me to suggest a schema.`)
}

const say = (text, extra = {}) => S.messages.push({ id: ++seq, role: 'model', text, ...extra })
const userSays = (text, tag) => S.messages.push({ id: ++seq, role: 'user', text, tag })
const instruction = () => S.instructions.join(' · ')
function ask(p) {
  if (S.pending) S.pending.resolved = 'Superseded'
  p.id = ++seq
  S.pending = p
  S.cursor = 0
  S.messages.push({ id: p.id, role: 'model', card: p })
}
function bumpPending() {
  if (!S.pending) return
  S.messages = S.messages.filter(m => m.card !== S.pending)
  S.messages.push({ id: ++seq, role: 'model', card: S.pending })
}
function planStep(key, status) {
  const s = S.plan?.find(s => s.key === key)
  if (s) s.status = status
}
function tick(fn, ms) {
  clearInterval(timer)
  timer = setInterval(() => { if (fn()) clearInterval(timer); render() }, ms)
}

function choose(id, key) {
  const p = S.pending
  if (!p || p.id !== Number(id)) return
  const opt = p.options.find(o => o.key === key)
  p.resolved = opt.label
  S.pending = null
  HANDLERS[p.kind](key)
  render()
}
const choosePending = key => S.pending?.options.some(o => o.key === key) ? choose(S.pending.id, key) : fallback()

const HANDLERS = {
  plan(k) {
    if (k === 'edit') { S.redirect = 'plan'; say('What should the plan do differently?'); return }
    S.plan.approved = k
    if (k === 'auto') S.allow.suggest = true
    S.allow.suggest ? runSuggestion() : askSuggest()
  },
  suggest(k) {
    if (k === 'no') { S.redirect = 'suggest'; say('OK. What should I focus on? For example *"only the letters, with sender and date"*.'); return }
    if (k === 'always') S.allow.suggest = true
    runSuggestion()
  },
  proposal(k) {
    if (k === 'apply') return applyProposal()
    if (k === 'discard') { S.proposal = null; S.stage = S.schema ? 'done' : 'start'; say('Discarded the proposal. Nothing was saved.'); return }
    S.redirect = 'proposal'
    say('What should I change? Try *"add a field for language"*, *"remove summary"* or *"rename place_written to place"*.')
  },
  strategy(k) {
    S.strategy = k
    planStep('strategy', 'done')
    say(`Saved **${cap(k)}** with revision ${S.rev}.`)
    askRun()
  },

function guessType(n) {
  if (/date|year|when/.test(n)) return 'date'
  if (/people|names|persons|list|places/.test(n)) return 'array<string>'
  if (/count|number|amount/.test(n)) return 'number'
  return 'string'
}

function editProposal(text) {
  const t = text.toLowerCase()
  const fields = (S.proposal ? S.proposal.fields : S.schema.map(f => ({ ...f, change: null }))).map(f => ({ ...f }))
  let m, did = false
  if ((m = t.match(/rename\s+(\w+)\s+to\s+(\w+)/))) {
    const f = fields.find(f => f.name.includes(m[1]))
    if (f) { f.from = f.from || f.name; f.name = m[2]; if (f.change !== 'add') f.change = 'rename'; did = true }
  } else if ((m = t.match(/(?:remove|drop|delete)\s+(?:the\s+)?(?:field\s+)?(\w+)/))) {
    const f = fields.find(f => f.name.includes(m[1]))
    if (f) { if (f.change === 'add' && S.schema === null) fields.splice(fields.indexOf(f), 1); else f.change = 'remove'; did = true }
  } else if ((m = t.match(/add\s+(?:a\s+|an\s+)?(?:new\s+)?(?:field\s+)?(?:for\s+)?(?:the\s+)?([a-z][a-z ]{1,30}?)(?:\s+field)?\s*(?:[.,!]|$)/))) {
    const name = m[1].trim().split(/\s+/).slice(0, 3).join('_')
    fields.push({ name, type: guessType(name), change: 'add' }); did = true
  }
  if (!did) return false
  S.proposal = { rev: S.proposal ? S.proposal.rev : S.rev + 1, fields }
  S.stage = 'proposal'; S.ws = 'schema'
  if (S.plan) { planStep('review', 'running') }
  say('Updated the proposal. Changes are marked.')
  askProposal()
  return true
}

  if (/\b(add|remove|rename|delete|drop|suggest|run|apply|extract)\b|添加|加一个|删除|生成|运行/.test(t)) return false
  if (/\b(article|catalog)\b/.test(t) && !/\?/.test(t)) return false
  return /[?？]\s*$/.test(t) || /^(who|what|when|where|which|how|why|is|are|does|do|did|can|could)\b/.test(t) || /吗|呢|什么|哪|谁|几|多少/.test(t)
}
const tagLast = tag => { const m = [...S.messages].reverse().find(m => m.role === 'user'); if (m) m.tag = tag }
const questionCount = () => S.messages.filter(m => m.tag === 'question').length
function answerQuestion(text) {
  const t = text.toLowerCase(), lang = zh(text) ? 'zh' : 'en'
  const qa = QA.find(q => q.re.test(t) && (!q.when || q.when()))
  const read = { w: 0, n: 4 }
  S.answering = read
  const msg = { id: ++seq, role: 'model', reading: read }
  S.messages.push(msg)
  const step = () => {
    if (++read.w < read.n) { render(); return setTimeout(step, 350) }
    S.answering = null
    msg.reading = null
    if (qa) {
      const pick = v => typeof v === 'function' ? v() : v
      msg.text = pick(qa[lang])
      msg.answer = { pages: qa.pages, cite: qa.cite, follow: qa.follow && !has(qa.field) ? { label: qa.follow[lang], text: qa.follow.text } : null }
    } else {
      msg.text = lang === 'zh' ? '文档里没有提到这一点。我读了全部 4 个 window，没有找到相关内容。' : "The document doesn't say. I read all 4 windows and found nothing about that."
      msg.answer = { pages: [] }
    }
    bumpPending()
    render()
  }
  setTimeout(step, 350)
}

function fallback() {
  say("*(Prototype: there is no model behind this.)* I didn't catch that. Try one of the suggestions under the chat.")
  bumpPending()
}

function onSend(raw) {
  const text = raw.trim()
  if (!text) return
  userSays(text)
  const t = text.toLowerCase()
  if (/^(start over|reset|restart)/.test(t)) { reset(); return render() }
  if (/\b(article|catalog)\b/.test(t) && /\?|what|difference|explain/.test(t)) {
    say('**Article**: the whole Source Document becomes one record (good for a single essay or report). **Catalog**: FREE finds the repeated records in the document and extracts each one (good for a PDF with many letters, entries or rows).')
    bumpPending(); return render()
  }
  if (isQuestion(t)) { tagLast('question'); answerQuestion(text); return render() }
  const r = S.redirect
  S.redirect = null
  if (r === 'suggest' || r === 'plan') { S.instructions.push(text); tagLast('instruction'); r === 'plan' ? askPlan() : askSuggest(); return render() }
  if (r === 'proposal') { if (!editProposal(text)) { S.redirect = 'proposal'; fallback() } return render() }
  switch (S.stage) {
    case 'start':
      // Before the first schema, anything that is not a question is kept as a generation instruction.
      if (!/^suggest( a)? schema\.?$/.test(t)) { S.instructions.push(text); tagLast('instruction') }
      if (S.pending) S.pending.resolved = 'Answered in chat', S.pending = null
      if (variant === 'C' && !S.plan) askPlan()
      else if (S.allow.suggest) runSuggestion()
      else askSuggest()
      break
    case 'proposal':
      if (/^(apply|looks good|ok|yes|good|great)/.test(t)) choosePending('apply')
      else if (!editProposal(text)) fallback()
      break
    case 'strategy':
      if (/catalog|many/.test(t)) choosePending('catalog')
      else if (/article|one/.test(t)) choosePending('article')
      else fallback()
      break
    case 'ready':
      if (/all|batch|every/.test(t)) choosePending('batch')
      else if (/run|go|yes|start/.test(t)) S.pending ? choosePending('one') : startRun(1)
      else if (!editProposal(text)) fallback()
      break
    case 'running':
      if (/pause|stop|wait/.test(t)) { S.run.paused = true; say('Paused. Records already read are saved; say *"resume"* to continue.') }
      else if (/resume|continue/.test(t)) { S.run.paused = false; say('Resumed.') }
      else say('The extraction is still running. I can pause it, or answer when it finishes.')
      break
    case 'done': case 'schema-edit':
      if (/review|check/.test(t)) choosePending('review')
      else if (/export/.test(t)) choosePending('export')
      else if (!editProposal(text)) fallback()
      break
    default: fallback()
  }
  render()
}

  const shown = Math.min(S.run.k, 8)
  const names = S.schema.map(f => f.name)
  return `<div class="row" style="margin-bottom:8px"><span style="font-size:20px;font-weight:700">${S.run.toCheck}</span><span class="muted small grow">to check · ${S.run.k} of ${S.run.n} records</span><span class="pill">rev ${S.rev} · ${cap(S.strategy)}</span></div>
  ${Array.from({ length: shown }, (_, i) => {
    const s = SAMPLE[i % SAMPLE.length], vals = { sender: s[0], recipient: s[1], date_written: s[2], place_written: s[3] }
    return `<div class="rec"><div class="row"><b class="grow">Letter ${i + 1}</b>${i % 5 === 1 ? '<span class="pill pill-stale">◐ to check</span>' : '<span class="pill pill-ev">✓ Evidence</span>'}</div>
      <div class="muted compact mono">${names.slice(0, 3).map(n => `${esc(n)}: ${esc(vals[n] || '…')}`).join(' · ')}</div></div>`
  }).join('')}${S.run.k > shown ? `<div class="faint compact" style="padding-top:6px">+ ${S.run.k - shown} more</div>` : ''}`
}

function schemaPanelHtml() {
  if (S.proposal) return `<div class="row" style="margin-bottom:8px"><span class="overline grow">Proposal · revision ${S.proposal.rev}</span><span class="pill pill-accent">unsaved</span></div>${fieldsHtml(S.proposal.fields)}`
  if (S.schema) return `<div class="row" style="margin-bottom:8px"><span class="overline grow">Revision ${S.rev}</span>${S.strategy ? `<span class="pill">${cap(S.strategy)}</span>` : '<span class="pill pill-stale">choose scope</span>'}</div>${fieldsHtml(S.schema, false)}`
  if (S.stage === 'suggesting') return `<div class="row muted small"><span class="spin"></span> Waiting for Schema Suggestion…</div>`
  return `<div class="muted small" style="padding:20px 4px">No schema yet. Describe what you want in the chat.</div>`
}

const navHtml = () => `<nav class="nav"><div class="overline" style="padding:0 8px 6px">Sources</div>
  <div class="nav-item cur">▤ Letters_1843.pdf</div><div class="nav-item">▤ Letters_1844.pdf</div><div class="nav-item">▤ Parish_register.pdf</div></nav>`

function stageIndex() {
  return { start: 0, suggesting: 1, proposal: 2, strategy: 3, ready: 4, running: 4, done: 5, 'schema-edit': 2 }[S.stage]
}

// ======================================================================
// Variant A: Rail copilot. The right rail becomes the chat; approvals are
// inline permission cards in the stream, resolved cards collapse to a line.
// ======================================================================
function renderA() {
  const stream = S.messages.map(m => {
    if (m.role === 'user') return userHtml(m)
    if (m.progress) return progressHtml(m.progress, m.run)
    if (m.card) {
      const p = m.card
      if (p.resolved) return `<div class="perm resolved"><div class="perm-head"><span>${p.resolved === 'Superseded' ? '↷' : '✓'}</span><span class="grow">${esc(p.title)}</span><span class="compact">${esc(p.resolved)}</span></div></div>`
      return `<div class="perm fade"><div class="perm-head"><span style="color:var(--accent)">⏵</span>${esc(p.title)}</div><div class="perm-body">
        ${kvHtml(p.detail)}${p.fields ? fieldsHtml(p.fields) : ''}${stepsHtml(p.steps)}
        <div><b>${esc(p.question)}</b></div>${optsHtml(p)}</div></div>`
    }
    return modelTextHtml(m, '<div class="who">FREE</div>')
  }).join('')
  const st = `<div class="status"><span class="faint">Schema</span>${S.schema ? `<span class="pill">rev ${S.rev} · ${S.schema.length} fields</span>` : '<span class="pill">none</span>'}
    <span class="faint">Scope</span><span class="pill">${cap(S.strategy)}</span>
    ${S.run ? `<span class="faint">Run</span><span class="pill ${S.stage === 'done' ? 'pill-green' : ''}">${S.run.k}/${S.run.n}</span>` : ''}</div>`
  return `<div class="A">${navHtml()}<main class="doc scroll">${docHtml()}</main>
    <aside class="rail"><div class="rail-head"><span class="overline grow">Assistant</span><span class="pill pill-accent">${STAGES[stageIndex()][1]}</span></div>
      ${st}<div class="stream scroll" id="stream">${stream}</div>
      <div class="foot">${chipsHtml()}${composerHtml(S.pending ? 'Choose above, or type to answer differently…' : 'Message FREE…')}</div></aside></div>`
}

// ======================================================================
// Variant B: Conversation desk. Chat is the page; a stage stepper on the left,
// a workspace preview on the right. Approvals never sit in the stream: they
// dock over the composer like a terminal prompt (1/2/3, ↑↓, Enter, Esc).
// ======================================================================
function renderB() {
  const cur = stageIndex()
  const summary = i => [
    [S.instructions.length && `${S.instructions.length} instruction${S.instructions.length > 1 ? 's' : ''}`, questionCount() && `${questionCount()} answered`].filter(Boolean).join(' · ') || 'Ask or describe',
    S.suggest ? (S.suggest.w >= S.suggest.n ? 'Read 4 windows' : `Window ${S.suggest.w + 1} of 4`) : DOC,
    S.schema ? `Revision ${S.rev} · ${S.schema.length} fields` : 'Apply a revision',
    S.strategy ? cap(S.strategy) : 'Record Scope',
    S.run ? `${S.run.k} of ${S.run.n} records` : 'Asks before running',
    S.run && S.stage === 'done' ? `${S.run.toCheck} to check` : 'Values to check',
  ][i]
  const steps = STAGES.map(([, t], i) => `<div class="step ${i < cur ? 'done' : i === cur ? 'cur' : ''}"><span class="dot">${i < cur ? '✓' : ''}</span><div><div class="t">${t}</div><div class="s">${esc(summary(i))}</div></div></div>`).join('')
  const stream = S.messages.map(m => {
    if (m.role === 'user') return userHtml(m)
    if (m.progress) return progressHtml(m.progress, m.run)
    if (m.card) {
      const p = m.card
      if (!p.resolved) return `<div class="tool"><span class="ln" style="color:var(--accent)">⏺</span><span>${esc(p.title)} · <i>waiting for you below</i></span></div>`
      return `<div class="tool"><span class="ln">⏺</span><div><b>${esc(p.title)}</b>${p.fields ? ` <span class="faint">(${p.fields.length} fields)</span>` : ''}<div class="ln">⎿ ${esc(p.resolved)}</div></div></div>`
    }
    return modelTextHtml(m)
  }).join('')
  const p = S.pending
  const dock = p
    ? `<div class="ask fade"><div class="ask-head"><div class="overline" style="color:var(--accent)">${esc(p.title)}</div>
        <div style="margin:4px 0 8px"><b>${esc(p.question)}</b></div>${kvHtml(p.detail)}${p.fields ? fieldsHtml(p.fields) : ''}${stepsHtml(p.steps)}</div>
        ${optsHtml(p, { cursor: S.cursor })}
        <div class="ask-foot"><span>↑↓ Enter · 1–${p.options.length} · Esc</span><span>│</span><input id="askinput" placeholder="…or type to tell FREE something else"></div></div>`
    : `${chipsHtml()}${composerHtml()}`
  const tab = S.ws
  const body = tab === 'schema' ? schemaPanelHtml() : tab === 'results' ? resultsHtml() : docHtml()
  return `<div class="B"><aside class="steps"><div class="overline" style="margin-bottom:10px">From source to results</div>${steps}</aside>
    <section class="center"><div class="stream scroll" id="stream"><div class="stream-in">${stream}</div></div><div class="dock">${p ? chipsHtml() : ''}${dock}</div></section>
    <aside class="ws"><div class="tabs">${['document', 'schema', 'results'].map(t => act(`ws:${t}`, cap(t), `tab ${t === tab ? 'cur' : ''}`)).join('')}</div><div class="ws-body scroll">${body}</div></aside></div>`
}

// ======================================================================
// Variant C: Workspace + command bar. Studio stays primary (doc + rail);
// chat is a floating command bar whose popover shows only the latest turn.
// The first request returns a plan; its steps light up as work proceeds,
// and proposals land in the real Schema panel with an Apply / Discard bar.
// ======================================================================
function renderC() {
  const lastUser = S.messages.map(m => m.role).lastIndexOf('user')
  const visible = S.expanded ? S.messages : S.messages.slice(Math.max(0, lastUser))
  const turn = visible.map(m => {
    if (m.role === 'user') return userHtml(m)
    if (m.progress) return progressHtml(m.progress, m.run)
    if (m.card) {
      const p = m.card
      if (p.resolved) return `<div class="faint small" style="margin:4px 0">✓ ${esc(p.title)} · ${esc(p.resolved)}</div>`
      return `<div class="fade" style="margin-top:6px"><b>${esc(p.question)}</b>${kvHtml(p.detail) ? `<div style="margin-top:6px">${kvHtml(p.detail)}</div>` : ''}
        ${p.kind === 'proposal' ? '<div class="small muted" style="margin-top:4px">The proposal is open in the Schema panel →</div>' : ''}
        <div class="hopts">${p.options.map(o => act(`choose:${p.id}:${o.key}`, esc(o.label), `btn ${o.tone === 'green' ? 'btn-green' : o.tone === 'danger' ? 'btn-out-danger' : o.tone === 'esc' ? 'btn-ghost' : ''}`, o.hint ? `title="${esc(o.hint)}"` : '')).join('')}</div></div>`
    }
    return modelTextHtml(m)
  }).join('')
  const plan = S.plan && S.plan.approved ? `<div class="plan fade"><div class="row" style="margin-bottom:6px"><span class="overline grow">Plan</span><span class="faint compact">${S.plan.filter(s => s.status === 'done').length}/${S.plan.length}</span></div>
    ${S.plan.map(s => `<div class="pstep ${s.status}"><span class="ic">${s.status === 'done' ? '✓' : s.status === 'running' ? '●' : '○'}</span><span>${esc(s.label)}</span></div>`).join('')}</div>` : ''
  const tab = S.ws === 'results' ? 'results' : 'schema'
  const proposalPending = S.pending?.kind === 'proposal'
  const applybar = proposalPending ? `<div class="applybar"><span class="small grow"><b>Proposal</b> from chat</span>
    ${act(`choose:${S.pending.id}:discard`, 'Discard', 'btn btn-out-danger')}${act(`choose:${S.pending.id}:apply`, `✓ Apply rev ${S.proposal.rev}`, 'btn btn-green')}</div>` : ''
  const runBtn = S.stage === 'ready' && S.pending?.kind === 'run' ? act(`choose:${S.pending.id}:one`, '▶ Run extraction', 'btn btn-green') : ''
  return `<div class="C">${navHtml()}
    <section class="docwrap"><main class="doc scroll">${docHtml()}</main>${plan}
      <div class="cmd"><div class="pop"><div class="pop-head"><span class="who grow" style="margin:0">FREE</span>
        ${act('expand', S.expanded ? 'Latest turn only' : `Show conversation (${S.messages.length})`, 'btn btn-ghost')}</div>
        <div class="pop-body scroll" id="stream">${turn}</div></div>
        ${chipsHtml()}${composerHtml('Ask FREE to… (⌘K)')}</div></section>
    <aside class="rail"><div class="tabs">${act('ws:schema', `Schema${S.proposal ? ' <span class="pill pill-accent">1</span>' : ''}`, `tab ${tab === 'schema' ? 'cur' : ''}`)}${act('ws:results', `Results${S.run && S.stage === 'done' ? ` <span class="pill pill-stale">${S.run.toCheck}</span>` : ''}`, `tab ${tab === 'results' ? 'cur' : ''}`)}
      <span class="grow"></span>${runBtn}</div>
      <div class="rail-body scroll">${tab === 'results' ? resultsHtml() : schemaPanelHtml()}</div>${applybar}</aside></div>`
}

// ======================================================================
// Shell: render, switcher, events
// ======================================================================
const VARIANTS = {
  A: { name: 'Rail copilot (inline approvals)', render: renderA },
  B: { name: 'Conversation desk (docked prompt)', render: renderB },
  C: { name: 'Workspace + command bar (plan)', render: renderC },
}
const KEYS = Object.keys(VARIANTS)
let variant = (new URLSearchParams(location.search).get('variant') || 'A').toUpperCase()
if (!VARIANTS[variant]) variant = 'A'
let showState = false

function render() {
  const ta = document.getElementById('composer')
  const draft = ta?.value ?? '', focused = document.activeElement === ta
  document.getElementById('app').innerHTML = VARIANTS[variant].render()
  const nta = document.getElementById('composer')
  if (nta) { nta.value = draft; if (focused) nta.focus() }
  const stream = document.getElementById('stream')
  if (stream) stream.scrollTop = stream.scrollHeight
  const i = KEYS.indexOf(variant)
  document.getElementById('switcher').innerHTML = `${act('prev', '←')}<span class="lbl">${variant} · ${VARIANTS[variant].name}</span>${act('next', '→')}${act('reset', '↺ reset')}${act('state', '{ } state')}`
  const sp = document.getElementById('statepanel')
  sp.hidden = !showState
  if (showState) sp.textContent = JSON.stringify({ ...S, messages: `${S.messages.length} messages`, pending: S.pending && { kind: S.pending.kind, options: S.pending.options.map(o => o.key) } }, null, 2)
}

function setVariant(v) {
  variant = v
  const u = new URL(location.href)
  u.searchParams.set('variant', v)
  history.replaceState(null, '', u)
  render()
}
const cycle = d => setVariant(KEYS[(KEYS.indexOf(variant) + d + KEYS.length) % KEYS.length])

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]')
  if (!el) return
  const [a, ...rest] = el.dataset.act.split(':'), arg = rest.join(':')
  if (a === 'choose') { const [id, key] = arg.split(':'); return choose(id, key) }
  if (a === 'chip') return onSend(arg)
  if (a === 'send') { const ta = document.getElementById('composer'); const v = ta.value; ta.value = ''; return onSend(v) }
  if (a === 'ws') { S.ws = arg; return render() }
  if (a === 'cite') { S.cite = arg || null; if (variant === 'B') S.ws = 'document'; return render() }
  if (a === 'expand') { S.expanded = !S.expanded; return render() }
  if (a === 'pause') { S.run.paused = !S.run.paused; say(S.run.paused ? 'Paused. Records already read are saved.' : 'Resumed.'); return render() }
  if (a === 'prev') return cycle(-1)
  if (a === 'next') return cycle(1)
  if (a === 'reset') { reset(); return render() }
  if (a === 'state') { showState = !showState; return render() }
})

document.addEventListener('keydown', e => {
  const t = e.target
  const typing = t.matches?.('input, textarea, [contenteditable]')
  if (t.id === 'composer' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const v = t.value; t.value = ''; return onSend(v) }
  if (t.id === 'askinput' && e.key === 'Enter') { e.preventDefault(); const v = t.value; return onSend(v) }
  if (typing) return
  if (e.key === 'ArrowLeft') return cycle(-1)
  if (e.key === 'ArrowRight') return cycle(1)
  // Variant B's terminal-style prompt
  const p = S.pending
  if (variant !== 'B' || !p) return
  if (/^[1-9]$/.test(e.key) && p.options[e.key - 1]) return choose(p.id, p.options[e.key - 1].key)
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.cursor = (S.cursor + (e.key === 'ArrowDown' ? 1 : -1) + p.options.length) % p.options.length; return render() }
  if (e.key === 'Enter') return choose(p.id, p.options[S.cursor].key)
  if (e.key === 'Escape') { const o = p.options.find(o => o.tone === 'esc'); if (o) choose(p.id, o.key) }
})

reset()
render()
</script>
</body>
</html>
