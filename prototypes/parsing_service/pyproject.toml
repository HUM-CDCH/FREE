[project]
name = "kei-exp"
version = "0.1.0"
description = "FREE document parsing, extraction, and durable job worker"
readme = "README.md"
authors = [
    { name = "GennaroBaratta", email = "gennaro.baratta@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docling>=2.127.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pillow>=10.4.0",
    "pydantic>=2.13.5",
    "pypdfium2>=5.13.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "surya-ocr>=0.22.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
    "uvicorn[standard]>=0.53.0",
    "procrastinate==3.9.0",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
kei-exp = "kei_exp.convert:main"
kie = "kei_exp.kie.cli:main"
kei-jobs = "kei_exp.jobs.cli:main"

[tool.uv]
link-mode = "copy"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.ruff]
# The codebase is written at about 120 columns; the default 88 would reflow every file it touches.
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: spawns real processes or containers",
    "postgres: requires a disposable PostgreSQL database",
    "live_model: loads Docling models or runs a real conversion worker",
]
