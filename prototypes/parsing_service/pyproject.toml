[project]
name = "parsing_service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.106.0",
    "fastapi[standard]>=0.138.0",
    "onnxruntime>=1.27.0",
    "paddleocr>=3.7.0",
    "paddlepaddle-gpu==3.3.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "paddlepaddle==3.0.0; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine != 'x86_64')",
    "paddlex[ocr]>=3.7.1",
]

[[tool.uv.index]]
name = "paddlepaddle-cuda"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddlepaddle-cuda" }
