[project]
name = "parsing-service"
version = "0.1.0"
description = "Small Docling-backed parsing service for FREE"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "docling>=2.111.0",
  "fastapi[standard]>=0.139.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
