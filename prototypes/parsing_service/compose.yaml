services:
  parsing_service:
    build: .
    ports:
      - "8055:8055"
    volumes:
      - ./data:/app/data        # task outputs persist on host
      - models:/models          # docling/HF + paddlex model caches (HOME)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
