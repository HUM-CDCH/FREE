[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "pillow>=12.2.0",
    "pydantic-settings>=2.14.1",
    "pypdfium2>=5.9.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["application", "config", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["model_providers*", "shared*", "use_cases*"]

[tool.setuptools.package-data]
model_providers = ["task_instructions/*.txt"]
