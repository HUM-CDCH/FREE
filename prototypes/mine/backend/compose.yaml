services:
  # Placeholder service: exists only so Docker Model Runner provisions the
  # nuextract3 model on `docker compose up`. The backend runs outside compose
  # and reads its configuration from its own .env.
  nuextract3-model:
    image: busybox:1.37
    command: ["sh", "-c", "sleep infinity"]
    models:
      nuextract3:
        endpoint_var: NUEXTRACT3_BASE_URL
        model_var: NUEXTRACT3_MODEL

models:
  nuextract3:
    model: ${NUEXTRACT3_MODEL:-hf.co/numind/NuExtract3-GGUF:Q4_K_M}
    context_size: 16384
