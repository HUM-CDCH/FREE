services:
  nuextract3-model:
    image: busybox:1.37
    command: ["sh", "-c", "sleep infinity"]
    environment:
      NUEXTRACT3_API_KEY: ${NUEXTRACT3_API_KEY:-EMPTY}
      NUEXTRACT3_TIMEOUT_SECONDS: ${NUEXTRACT3_TIMEOUT_SECONDS:-120}
      NUEXTRACT3_PDF_DPI: ${NUEXTRACT3_PDF_DPI:-64}
    models:
      nuextract3:
        endpoint_var: NUEXTRACT3_BASE_URL
        model_var: NUEXTRACT3_MODEL

models:
  nuextract3:
    model: ${NUEXTRACT3_MODEL:-hf.co/numind/NuExtract3-GGUF:mmproj}
    context_size: 16384
