services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.2.1
    environment:
      JSON_CONFIG: |
        {
          "interactiveLogin": true
        }
    ports:
      - "127.0.0.1:${FREE_PLAYWRIGHT_OIDC_PORT}:8080"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "${FREE_PLAYWRIGHT_DATABASE_NAME}"
      POSTGRES_PASSWORD: free_e2e
      POSTGRES_USER: free_e2e
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "127.0.0.1:${FREE_PLAYWRIGHT_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
