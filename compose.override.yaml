# Development overlay, loaded automatically by `docker compose up`. The
# topology is identical to production — nginx TLS entry point, prefixed
# STUDIO_BASE_PATH — with Studio and the Parsing Service running their
# reload-capable development servers, live source sync, sign-in through the
# local mock OIDC service below, and mkcert certificates from .certs/
# (generated by `pnpm dev`).
#
# The Studio container has no bind mount, so every input it runs either arrives
# through a rule below or is baked into the image. Each rule therefore watches a
# whole workspace package and names what must NOT travel, rather than listing the
# directories that may: a new source file, or a config the dev server reads at
# boot, cannot then be silently left behind in the image. `.dockerignore` is the
# single deny-list for host-local and generated artifacts — Compose Watch applies
# it on top of these rules — and dependency shape is never copied: manifests and
# the image definition rebuild instead.
services:
  db:
    environment:
      POSTGRES_PASSWORD: "${FREE_POSTGRES_PASSWORD:-postgres}"
    ports:
      - "127.0.0.1:5432:5432"

  parsing_service:
    command: ["uv", "run", "--no-sync", "python", "-X", "utf8", "-m", "fastapi", "dev", "main.py", "--host", "0.0.0.0", "--port", "8055"]
    develop:
      watch:
        - action: sync
          path: ./prototypes/parsing_service
          target: /app
          initial_sync: true
          ignore:
            - pyproject.toml
            - uv.lock
            - Dockerfile
            - .venv/
            - .pytest_cache/
            - .ruff_cache/
            - __pycache__/
            # Runtime tasks live in the named volume mounted at /app/data.
            - data/
        - action: rebuild
          path: ./prototypes/parsing_service/pyproject.toml
        - action: rebuild
          path: ./prototypes/parsing_service/uv.lock
        - action: rebuild
          path: ./prototypes/parsing_service/Dockerfile

  studio:
    command: ["pnpm", "--filter", "studio", "dev", "--host", "0.0.0.0", "--strictPort"]
    environment:
      NODE_ENV: development
      # The whole dedicated proxy network is the trusted peer set; only the
      # nginx container and Studio join it, so any peer in this block is the
      # reverse proxy.
      FREE_STUDIO_PROXY_ADDRESS: 172.30.0.0/24
      DATABASE_URL: "postgresql://postgres:${FREE_POSTGRES_PASSWORD:-postgres}@db:5432/free"
      # `pnpm dev` generates and persists this per machine. Without it the dev
      # server mints a session secret per boot, so every restart silently
      # invalidates the Researcher's session cookie.
      FREE_SESSION_SECRET: "${FREE_SESSION_SECRET:?FREE_SESSION_SECRET comes from pnpm dev; start the stack with it}"
      VITE_SHOW_DEVELOPER_UI: "true"
      # Development sign-in drives the production Entra client code against the
      # mock-oidc service. The token endpoint is redeemed server-side over the
      # app network; the browser follows authorize/end-session redirects to the
      # published loopback port. The Entra overlay removes these mock-only values.
      FREE_ENTRA_MOCK_ISSUER: http://mock-oidc:8080/dev
      # The Wi-Fi launcher profile overrides this with the selected private
      # address so a phone can follow the authorize redirect.
      FREE_ENTRA_MOCK_BROWSER_ISSUER: "${FREE_ENTRA_MOCK_BROWSER_ISSUER:-http://localhost:8444/dev}"
    depends_on:
      mock-oidc:
        condition: service_started
        required: false
    develop:
      watch:
        - action: sync
          path: ./prototypes/studio
          target: /workspace/prototypes/studio
          initial_sync: true
          ignore:
            # Dependency shape; the rebuild rules below own it.
            - package.json
            # Host-side browser tests. The container serves Studio, never runs them.
            - e2e/
            - playwright.config.ts
            # Host-local and build output. `.dockerignore` covers these for the
            # image, and naming them rule-relative keeps the sync explicit.
            - node_modules/
            - dist/
            - dist-lib/
            - test-results/
            - .certs/
            - .design-sync/
        - action: sync
          path: ./packages/db
          target: /workspace/packages/db
          initial_sync: true
          ignore:
            - package.json
            - node_modules/
            # Rebuild-owned Prisma Next inputs below.
            - prisma-next.config.ts
            - migrations/
            - src/prisma/contract.prisma
            # These are generated for Linux while the image is built. Do not
            # replace them with host-generated or host-installed artifacts.
            - src/generated/
            - src/prisma/contract.d.ts
            - src/prisma/contract.json
            - src/prisma/node_modules/
            - src/prisma/src/
        - action: sync
          path: ./packages/studio-configuration
          target: /workspace/packages/studio-configuration
          initial_sync: true
          ignore:
            - package.json
            - node_modules/
        - action: sync
          path: ./packages/extraction-result-export
          target: /workspace/packages/extraction-result-export
          initial_sync: true
          ignore:
            - package.json
            - node_modules/
        - action: sync
          path: ./packages/extraction
          target: /workspace/packages/extraction
          initial_sync: true
          ignore:
            - package.json
            - node_modules/
        # A copy cannot install a dependency or re-run the image build, so these
        # rebuild. Syncing them would leave the container's tree describing a
        # dependency graph it does not have.
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./packages/db/package.json
        # Rebuild the image so contract emission and entrypoint migration replay
        # cannot keep generated clients or the live schema on stale inputs.
        - action: rebuild
          path: ./packages/db/prisma-next.config.ts
        - action: rebuild
          path: ./packages/db/src/prisma/contract.prisma
        - action: rebuild
          path: ./packages/db/migrations
        - action: rebuild
          path: ./packages/studio-configuration/package.json
        - action: rebuild
          path: ./packages/extraction-result-export/package.json
        - action: rebuild
          path: ./packages/extraction/package.json
        - action: rebuild
          path: ./prototypes/studio/package.json
        - action: rebuild
          path: ./prototypes/studio/Dockerfile
        - action: rebuild
          path: ./docker/studio-entrypoint.sh

  # Local OIDC identity provider for mock-only development sign-in. The
  # launcher activates this profile only for non-Entra local runs. It accepts
  # any client credential (so Studio's certificate client assertion passes
  # unchanged) and issues silently — no login page. The pinned claims identify
  # the default Development Researcher; the normal callback creates or refreshes
  # that Researcher Account.
  mock-oidc:
    profiles: ["mock-oidc"]
    image: ghcr.io/navikt/mock-oauth2-server:2.2.1
    environment:
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "dev",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "grant_type",
                  "match": "*",
                  "claims": {
                    "tid": "00000000-0000-4000-8000-000000000001",
                    "oid": "00000000-0000-4000-8000-000000000002",
                    "name": "Development Researcher"
                  }
                }
              ]
            }
          ]
        }
    ports:
      - "${FREE_MOCK_OIDC_BIND:-127.0.0.1}:8444:8080"
    networks:
      - app

  # The development TLS entry point. Production has no nginx container: the
  # host-managed nginx includes the same rendered
  # docker/nginx/free-studio-locations.inc.template and proxies to Studio's
  # loopback-published port (compose.prod.yaml).
  nginx:
    image: nginx:stable-alpine
    environment:
      STUDIO_BASE_PATH: "${STUDIO_BASE_PATH:-/free}"
      FREE_STUDIO_UPSTREAM: studio:5173
    ports:
      - "${FREE_NGINX_BIND:-127.0.0.1}:${FREE_NGINX_PORT:-8443}:443"
    volumes:
      - type: bind
        source: ./docker/nginx/free-studio.conf.template
        target: /etc/nginx/templates/free-studio.conf.template
        read_only: true
        bind:
          create_host_path: false
      # Renders next to the wrapper as conf.d/free-studio-locations.inc; the
      # .inc suffix keeps it out of nginx's automatic conf.d/*.conf include.
      - type: bind
        source: ./docker/nginx/free-studio-locations.inc.template
        target: /etc/nginx/templates/free-studio-locations.inc.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.certs/studio.crt
        target: /etc/nginx/tls/studio.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.certs/studio.key
        target: /etc/nginx/tls/studio.key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      studio:
        condition: service_healthy
    networks:
      - proxy
