# Development-only overlay that swaps the mock-only development identity
# profile for the real Microsoft Entra tenant on top of the automatic
# development overlay:
#
#   docker compose -f compose.yaml -f compose.override.yaml -f compose.entra.yaml up --build --watch
#
# Requires the four FREE_ENTRA_* values in .env and the exact
# https://localhost:8443/free/auth/callback and .../auth/signed-out URIs
# registered on the Entra application. See
# docs/operations/entra-authentication.md.
services:
  studio:
    # The four real FREE_ENTRA_* values and the client-certificate mount are
    # duplicated in compose.prod.yaml (Compose cannot share anchors across
    # files); keep those entries identical.
    environment:
      FREE_ENTRA_REAL: "1"
      # Null removes the mock issuers from the container environment.
      FREE_ENTRA_MOCK_ISSUER:
      FREE_ENTRA_MOCK_BROWSER_ISSUER:
      FREE_ENTRA_TENANT_ID: "${FREE_ENTRA_TENANT_ID:?FREE_ENTRA_TENANT_ID must be the application tenant UUID}"
      FREE_ENTRA_CLIENT_ID: "${FREE_ENTRA_CLIENT_ID:?FREE_ENTRA_CLIENT_ID must be the application client UUID}"
      FREE_ENTRA_CLIENT_CERT_PATH: /run/secrets/free-entra-client.pem
      FREE_ENTRA_CLIENT_CERT_THUMBPRINT: "${FREE_ENTRA_CLIENT_CERT_THUMBPRINT:?FREE_ENTRA_CLIENT_CERT_THUMBPRINT must be the SHA-256 certificate thumbprint}"
    # The mock service has its own inactive profile; remove even the optional
    # dependency from the rendered real-Entra topology.
    depends_on:
      mock-oidc: !reset null
    volumes:
      - type: bind
        source: "${FREE_ENTRA_CLIENT_CERT_PATH:?FREE_ENTRA_CLIENT_CERT_PATH must name the Entra client private-key PEM}"
        target: /run/secrets/free-entra-client.pem
        read_only: true
        bind:
          create_host_path: false
