# Scan production source code across the workspace.
source_dir: ./

# Paths are matched relative to source_dir using .gitignore-style patterns.
source_dir_exclude:
  # Repository metadata, agent tooling, dependencies, and local environments.
  - "**/.git/**"
  - "**/.codegraph/**"
  - "**/.agents/**"
  - "**/.codex/**"
  - "**/.openai/**"
  - "**/.slopo/**"
  - "**/.scratch/**"
  - "**/.design-sync/**"
  - "**/.ds-sync/**"
  - "**/.playwright-mcp/**"
  - "**/.omo/**"
  - "**/node_modules/**"
  - "**/.pnpm-store/**"
  - "**/.venv/**"

  # Generated output, caches, reports, and runtime data.
  - "**/__pycache__/**"
  - "**/.pytest_cache/**"
  - "**/.ruff_cache/**"
  - "**/.vite/**"
  - "**/.next/**"
  - "**/dist/**"
  - "**/dist-lib/**"
  - "**/dist-ssr/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/artifacts/**"
  - "**/data/**"
  - "**/logs/**"
  - "**/test-results/**"
  - "**/playwright-report/**"
  - "**/comparison_output/**"
  - "**/slopo-report/**"
  - "**/generated/**"
  - "**/*.d.ts"

  # Tests, fixtures, and historical database migrations.
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/e2e/**"
  - "**/fixtures/**"
  - "**/mocks/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/conftest.py"
  - "**/migrations/**"

  # Documentation, specifications, and tool configuration are not product code.
  - "docs/**"
  - "openspec/**"
  - "scripts/**"
  - "tools/**"
  - "**/*.config.js"
  - "**/*.config.cjs"
  - "**/*.config.mjs"
  - "**/*.config.ts"

# Standalone Slopo fallback. The operational four-model pipeline is managed by
# tools/slopo-benchmark/pipeline.ps1 because pplx and Voyage require adapters
# that stock `slopo embed` cannot express.
db_file: ./.slopo/standalone/qwen3-1024d/slopo.db
report_dir: ./.slopo/standalone/qwen3-1024d/report
ignore_file: ./.slopo/standalone/qwen3-1024d/slopo.ignore.txt

embedding_model: openai/qwen3-0.6b
embedding_dimensions: 1024
embedding_api_key: local

embedding_params:
  custom_llm_provider: openai
  api_base: http://127.0.0.1:18080/v1
  drop_params: true

similarity_threshold: 0.8761616161616161
rerank_threshold: 0.8761616161616161
body_node_count_threshold: 10
